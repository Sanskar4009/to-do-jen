{% extends "base.html" %}

{% block title %}404 - Page Not Found | CloudTodo{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-card">
        <div class="error-code-badge">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-desc">The task or resource you are looking for does not exist or may have been removed from the database.</p>
        <div class="error-actions">
            <a href="{{ url_for('main.index') }}" class="btn btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"/>
                    <polyline points="12 19 5 12 12 5"/>
                </svg>
                <span>Return to Dashboard</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
